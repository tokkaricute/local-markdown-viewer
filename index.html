<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Markdown Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .editor, .preview {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor {
            border-right: 1px solid #ccc;
        }

        /* Hide editor when in preview mode */
        body.preview-only .editor {
            display: none;
        }
        body.preview-only .container {
            display: block;
        }
        body.preview-only .preview {
            flex: 1;
        }

        .header {
            padding: 10px 20px;
            background-color: #eee;
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            padding: 20px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            border: none;
            outline: none;
            resize: none;
            background-color: #f9f9f9;
        }

        #preview {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: white;
        }

        /* Markdown Styles */
        #preview h1, #preview h2, #preview h3 { border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
        #preview code { background-color: rgba(27,31,35,.04); border-radius: 3px; padding: .2em .4em; font-family: monospace; }
        #preview pre { background-color: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; position: relative; }
        #preview blockquote { border-left: .25em solid #dfe2e5; color: #6a737d; padding: 0 1em; margin-left: 0; }
        #preview table { border-collapse: collapse; width: 100%; }
        #preview table th, #preview table td { border: 1px solid #dfe2e5; padding: 6px 13px; }
        #preview table tr { background-color: #fff; border-top: 1px solid #c6cbd1; }
        #preview table tr:nth-child(2n) { background-color: #f6f8fa; }
        #preview img { max-width: 100%; }

        .btn {
            padding: 5px 12px;
            background-color: #0366d6;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: normal;
        }

        .btn:hover {
            background-color: #0256b9;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        /* Download Button style */
        .btn-download {
            display: block;
            margin-top: 10px;
            margin-bottom: 20px;
            background-color: #28a745;
            font-size: 12px;
            width: fit-content;
        }
        .btn-download:hover {
            background-color: #218838;
        }

        .mermaid-container {
            margin-bottom: 20px;
        }
    </style>
    <!-- Mermaid from local directory -->
    <script src="mermaid.min.js"></script>
    <!-- Marked from local directory -->
    <script src="marked.min.js"></script>
</head>
<body>

<div class="container">
    <div class="editor">
        <div class="header">
            <span>Editor (Markdown)</span>
            <div class="button-group">
                <button class="btn" onclick="render()">Render</button>
                <button class="btn btn-secondary" onclick="openInNewWindow()">Open in New Window</button>
            </div>
        </div>
        <textarea id="editor" placeholder="Markdownを入力してください..."></textarea>
    </div>
    <div class="preview">
        <div class="header">
            <span>Preview</span>
        </div>
        <div id="preview"></div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    mermaid.initialize({ startOnLoad: false });

    /**
     * Finds the text of the nearest preceding heading element using DOM traversal.
     */
    function getNearestHeading(element) {
        let current = element;
        
        while (current && current !== document.body) {
            // 1. Check if the current element itself is a heading
            if (['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(current.tagName)) {
                return current.textContent.trim();
            }

            // 2. Check the previous siblings of the current element
            let prev = current.previousElementSibling;
            while (prev) {
                if (['H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(prev.tagName)) {
                    return prev.textContent.trim();
                }
                prev = prev.previousElementSibling;
            }

            // 3. Move up to the parent
            current = current.parentElement;
        }
        return null;
    }

    async function render(targetElement = preview) {
        const markdownText = editor.value;
        if (!markdownText) {
            targetElement.innerHTML = "";
            return;
        }
        
        const htmlContent = marked.parse(markdownText);
        targetElement.innerHTML = htmlContent;

        const mermaidCodeBlocks = targetElement.querySelectorAll('code.language-mermaid');
        mermaidCodeBlocks.forEach((codeBlock, index) => {
            const pre = codeBlock.parentElement;
            const container = document.createElement('div');
            container.className = 'mermaid-container';
            
            const mermaidDiv = document.createElement('div');
            mermaidDiv.className = 'mermaid';
            mermaidDiv.textContent = codeBlock.textContent;
            
            container.appendChild(mermaidDiv);

            // Find filename based on nearest heading in the DOM
            const headingText = getNearestHeading(pre);
            // Sanitize filename: allow alphanumeric, spaces, and common Japanese characters
            const sanitizedHeading = headingText 
                ? headingText.replace(/[^a-zA-Z0-9\u3040-\u30FF\u4E00-\u9FFF\s]/gi, '_')
                : 'diagram';
            const fileName = `${sanitizedHeading}-${index + 1}.png`;

            const btn = document.createElement('button');
            btn.className = 'btn btn-download';
            btn.textContent = 'Download PNG';
            btn.onclick = (e) => {
                e.preventDefault();
                downloadSvgAsPng(mermaidDiv, fileName);
            };
            container.appendChild(btn);

            pre.parentNode.replaceChild(container, pre);
        });

        try {
            await mermaid.run({
                nodes: targetElement.querySelectorAll('.mermaid'),
            });
        } catch (err) {
            console.error("Mermaid rendering error:", err);
        }
    }

    function downloadSvgAsPng(mermaidDiv, fileName) {
        const svg = mermaidDiv.querySelector('svg');
        if (!svg) {
            alert("SVGがまだレンダリングされていないか、見つかりません。");
            return;
        }

        const rect = svg.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        if (width === 0 || height === 0) {
            alert("SVGのサイズが0です。描画が完了していない可能性があります。");
            return;
        }

        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(svgBlob);

        // High resolution scaling (approx 600 DPI equivalent relative to 96 DPI)
        const scale = 6; 

        img.onload = function() {
            canvas.width = width * scale;
            canvas.height = height * scale;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Draw with scaling
            ctx.drawImage(img, 0, 0, width, height, 0, 0, width * scale, height * scale);
            
            const pngUrl = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = pngUrl;
            downloadLink.download = fileName;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            URL.revokeObjectURL(url);
        };

        img.onerror = function() {
            alert("画像の変換中にエラーが発生しました。");
            URL.revokeObjectURL(url);
        };

        img.src = url;
    }

    function openInNewWindow() {
        const markdownText = editor.value;
        if (!markdownText) {
            alert("表示するテキストがありません。");
            return;
        }
        localStorage.setItem('markdown_viewer_preview_content', markdownText);
        window.open('index.html?mode=preview', '_blank');
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const isPreviewMode = urlParams.get('mode') === 'preview';

        if (isPreviewMode) {
            document.body.classList.add('preview-only');
            const savedContent = localStorage.getItem('markdown_viewer_preview_content');
            if (savedContent) {
                editor.value = savedContent;
                render(preview);
            } else {
                preview.innerHTML = "コンテンツがありません。";
            }
        } else {
            const savedContent = localStorage.getItem('markdown_viewer_preview_content');
            if (savedContent) {
                editor.value = savedContent;
            }
            render(preview);
        }
    });

    let timeout = null;
    editor.addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(render, 500);
    });

</script>

</body>
</html>
